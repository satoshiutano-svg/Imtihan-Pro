name: roshan_study
description: Free, offline-first educational application for Grades 9-12 students in Khyber Pakhtunkhwa, Pakistan.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.16
  go_router: ^14.6.2
  http: ^1.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
